name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: vectors + go + cross-language
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Claude workflow dependency lockstep
        run: python3 scripts/check-claude-model-lockstep.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Root module — test/vet/fmt
        run: |
          # go.mod is the root compatibility source of truth. This equality
          # proves setup-go selected the exact patch named there rather than
          # floating within that minor series — so CI exercises the declared
          # floor itself, which is the version downstream consumers are
          # promised. It deliberately assumes go.mod has no toolchain directive.
          expected_go="go$(awk '$1 == "go" { print $2 }' go.mod)"
          test "$(go env GOVERSION)" = "$expected_go"
          go test ./...
          go vet ./...
          if [ -n "$(gofmt -l .)" ]; then echo "::error::gofmt"; gofmt -l .; exit 1; fi

      - name: Root module must be dependency-free
        run: |
          if grep -qE '^[[:space:]]*require[[:space:]]' go.mod; then
            echo "::error::root go.mod must have no require directive (zero-dep embed module)"; grep -n require go.mod; exit 1
          fi

      - name: Sanitizer gate (no private-repo leakage in vectors/docs/packages)
        run: |
          if grep -rInE 'nhp-OWNED|nhp-owned|endpoints/server/internal|endpoints/js-agent|nhp/core|\bvendored\b|vendoring' vectors/ npm/vectors/ python/qurl_conformance/_data/ README.md 2>/dev/null; then
            echo "::error::private-repo leak term found"; exit 1
          fi

      - name: Vector byte-identity (root == npm == python)
        run: bash scripts/check-sync.sh

      - name: Set up Node for npm package smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: npm package smoke
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const net = require('node:net');
          const c = require('./npm');

          const files = {
            qv2Vectors: 'qv2_conformance_vectors.json',
            issuerSignatureVectors: 'issuer_signature_vectors.json',
            relayKnockVectors: 'relay_knock_golden.json',
            agentRegistrationVectors: 'agent_registration_golden.json',
            agentAssignmentVectors: 'agent_assignment_golden.json',
            agentKnockApplicationVectors: 'agent_knock_application_vectors.json',
            agentSessionControlVectors: 'agent_session_control_vectors.json',
            agentApiKeyIdVectors: 'agent_api_key_id_vectors.json',
            assignmentTicketVectors: 'assignment_ticket_v1_vectors.json',
            connectorResourceLstV1Vectors: 'connector_resource_lst_v1_vectors.json',
            connectorHubLstCookieVectors: 'connector_hub_lst_cookie_v1_vectors.json',
            agentCredentialRecoveryVectors: 'agent_credential_recovery_v1_vectors.json',
            cridV1Vectors: 'crid_v1_vectors.json',
            cridLinkKnockV1Vectors: 'crid_link_knock_v1_vectors.json',
            targetPathV1Vectors: 'target_path_v1_vectors.json',
            privateUploadV1Vectors: 'private_upload_v1_vectors.json',
          };
          assert.deepEqual(Object.keys(c).sort(), Object.keys(files).sort());
          assert.deepEqual(
            fs.readdirSync('./npm/vectors').filter(file => file.endsWith('.json')).sort(),
            Object.values(files).sort(),
          );
          for (const [accessor, file] of Object.entries(files)) {
            assert.deepEqual(c[accessor](), require('./npm/vectors/' + file));
          }

          const hc = c.connectorHubLstCookieVectors();
          const cd = c.cridV1Vectors();
          const pu = c.privateUploadV1Vectors();

          assert.equal(pu.contract.audience_key_id_rule, 'regex:^key_[A-Za-z0-9]{12}$');
          assert.equal(pu.contract.client_id_rule, 'regex:^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$');
          assert.equal(pu.contract.key_id_rule, 'regex:^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$');
          assert.equal(pu.contract.upload_request_id_rule, 'regex:^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$');
          assert.equal(pu.contract.upload_handle_rule, 'regex:^upl_[A-Za-z0-9_-]{43}$');
          assert.equal(pu.contract.authority_expires_at_rule, 'rfc3339_utc_whole_seconds_uppercase_z');
          assert.equal(pu.contract.body_length_rule, 'positive_canonical_decimal_equal_to_exact_body_byte_length');
          assert.equal(pu.contract.upload.media_type_rule, "regex:^[!#$%&'*+.^_`|~0-9a-z-]+/[!#$%&'*+.^_`|~0-9a-z-]+$");
          assert.equal(pu.contract.upload.media_type_subtype_rule, 'not_exactly_star');
          assert.equal(pu.contract.upload.filename_encoding, 'utf8_then_base64url_unpadded');
          assert.equal(pu.contract.upload.display_filename_rule, 'nfc_utf8_1_to_180_bytes_no_leading_or_trailing_unicode_whitespace_not_dot_or_dotdot_no_slash_or_backslash_no_unicode_control_cf_co_zl_or_zp');
          assert.equal(pu.contract.upload.content_type_rule, 'exactly_equal_to_signed_media_type');
          assert.deepEqual(pu.contract.refresh.body_key_order, [
            'upload_handle',
            'upload_request_id',
            'max_batch_size',
            'max_link_ttl_seconds',
            'authority_expires_at',
          ]);
          assert.equal(pu.contract.refresh.body_whitespace_rule, 'none_between_tokens');
          assert.equal(
            pu.contract.refresh.body_string_escaping_rule,
            'rfc8259_utf8_short_escapes_for_quote_backslash_backspace_tab_newline_formfeed_carriage_return_u00xx_for_other_u0000_to_u001f_controls_plus_lowercase_u003c_u003e_u0026_u2028_u2029',
          );
          assert.equal(pu.contract.refresh.content_type_rule, 'exactly_application/json');

          const frame = value => {
            if (typeof value !== 'string') throw new Error('private-upload frame value must be a string');
            const bytes = Buffer.from(value, 'utf8');
            const length = Buffer.alloc(4);
            length.writeUInt32BE(bytes.length);
            return Buffer.concat([length, bytes]);
          };
          const p256Order = BigInt('0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551');
          const inspectP256Signature = encoded => {
            if (!/^[A-Za-z0-9_-]+$/.test(encoded)) return { rejectClass: 'signature_encoding' };
            const der = Buffer.from(encoded, 'base64url');
            if (der.toString('base64url') !== encoded || der.length < 8 || der.length > 72) {
              return { rejectClass: 'signature_encoding' };
            }
            let offset = 0;
            if (der[offset++] !== 0x30 || der[offset++] !== der.length - offset) {
              return { rejectClass: 'signature_encoding' };
            }
            const integer = () => {
              if (der[offset++] !== 0x02) return undefined;
              const length = der[offset++];
              if (length < 1 || length > 33 || offset + length > der.length) return undefined;
              const bytes = der.subarray(offset, offset += length);
              const negative = Boolean(bytes[0] & 0x80);
              if (bytes.length > 1 && ((!negative && bytes[0] === 0 && !(bytes[1] & 0x80)) ||
                  (negative && bytes[0] === 0xff && (bytes[1] & 0x80)))) {
                return undefined;
              }
              const unsigned = BigInt('0x' + bytes.toString('hex'));
              return negative ? unsigned - (1n << BigInt(bytes.length * 8)) : unsigned;
            };
            const r = integer();
            const s = integer();
            if (r === undefined || s === undefined || offset !== der.length) {
              return { rejectClass: 'signature_encoding' };
            }
            if (r <= 0n || s <= 0n || r >= p256Order || s >= p256Order) {
              return { rejectClass: 'signature_scalar' };
            }
            if (s > p256Order / 2n) return { rejectClass: 'signature_malleability' };
            return { der };
          };
          const canonicalJSONString = value => JSON.stringify(value).replace(
            /[<>&\u2028\u2029]/g,
            character => '\\u' + character.codePointAt(0).toString(16).padStart(4, '0'),
          );
          const canonicalPositiveDecimal = value => /^[1-9][0-9]*$/.test(value) ? value : null;
          const canonicalRefreshBody = golden => {
            const maxBatchSize = canonicalPositiveDecimal(golden.max_batch_size_decimal);
            const maxLinkTTLSeconds = canonicalPositiveDecimal(golden.max_link_ttl_seconds_decimal);
            if (!maxBatchSize || !maxLinkTTLSeconds) return null;
            return Buffer.from(
              '{"upload_handle":' + canonicalJSONString(golden.upload_handle) +
              ',"upload_request_id":' + canonicalJSONString(golden.upload_request_id) +
              ',"max_batch_size":' + maxBatchSize +
              ',"max_link_ttl_seconds":' + maxLinkTTLSeconds +
              ',"authority_expires_at":' + canonicalJSONString(golden.authority_expires_at) + '}',
              'utf8',
            );
          };
          const verifyPrivateUpload = (operation, golden) => {
            const contract = pu.contract[operation];
            const body = Buffer.from(golden.body_hex, 'hex');
            const bodyHash = crypto.createHash('sha256').update(body).digest('hex');
            const values = { ...golden, body_sha256_hex: bodyHash };
            const canonical = Buffer.concat([
              Buffer.from(contract.signing_domain_ascii, 'ascii'),
              Buffer.from([0]),
              ...contract.field_order.map(name => frame(values[name])),
            ]);
            const inspected = inspectP256Signature(golden.signature_der_b64url);
            const stable = Buffer.concat([
              Buffer.from(contract.stable_request_domain_ascii, 'ascii'),
              Buffer.from([0]),
              ...contract.stable_request_field_order.map(name => frame(golden[name])),
            ]);
            const expectedRefreshBody = operation === 'refresh' ? canonicalRefreshBody(golden) : null;
            return !inspected.rejectClass &&
              body.length.toString() === golden.body_length_decimal &&
              bodyHash === golden.body_sha256_hex &&
              'sha-256=:' + crypto.createHash('sha256').update(body).digest('base64') + ':' === golden.content_digest_header &&
              canonical.toString('hex') === golden.canonical_hex &&
              crypto.createHash('sha256').update(canonical).digest('hex') === golden.signing_digest_hex &&
              stable.toString('hex') === golden.stable_request_canonical_hex &&
              crypto.createHash('sha256').update(stable).digest('hex') === golden.stable_request_digest_hex &&
              (operation !== 'upload' || golden.content_type === golden.media_type) &&
              (operation !== 'refresh' || (golden.content_type === 'application/json' && expectedRefreshBody?.equals(body))) &&
              (operation !== 'upload' || Buffer.from(golden.display_filename_utf8).toString('base64url') === golden.filename_b64url) &&
              crypto.verify(
                'sha256',
                canonical,
                crypto.createPublicKey({
                  key: Buffer.from(pu.fixture_key.public_key_der_b64url, 'base64url'),
                  format: 'der',
                  type: 'spki',
                }),
                inspected.der,
              );
          };
          const canonicalPrivateAuthority = value => {
            if (!value || value !== value.toLowerCase() || /[ /\\\t\r\n]/.test(value)) return false;
            if (value.includes('[') || value.includes(']') || (value.match(/:/g) || []).length > 1) return false;
            const separator = value.lastIndexOf(':');
            const host = separator < 0 ? value : value.slice(0, separator);
            const port = separator < 0 ? '' : value.slice(separator + 1);
            if (!host || host.length > 253 || host.endsWith('.')) return false;
            if (port && (!/^[1-9][0-9]*$/.test(port) || Number(port) > 65535)) return false;
            if (separator >= 0 && !port) return false;
            return host.split('.').every(label =>
              label.length >= 1 && label.length <= 63 && /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(label));
          };
          const canonicalPrivateNonce = value => {
            if (!/^[A-Za-z0-9_-]+$/.test(value)) return false;
            const decoded = Buffer.from(value, 'base64url');
            return decoded.length === 32 && decoded.toString('base64url') === value;
          };
          const privateUploadRejectClass = reject => {
            if (reject.base !== 'upload_golden' && reject.base !== 'refresh_golden') {
              throw new Error('unknown private-upload reject base: ' + reject.base);
            }
            const operation = reject.base === 'upload_golden' ? 'upload' : 'refresh';
            const golden = { ...pu[reject.base] };
            const contract = pu.contract[operation];
            let forbiddenHeader = false;
            const requestFields = new Set([
              'method', 'authority', 'path', 'nonce', 'body_sha256_hex', 'signature_der_b64url',
            ]);
            if (operation === 'upload') requestFields.add('audience_key_id');
            for (const mutation of reject.mutations) {
              if (mutation.target === 'request_field' && requestFields.has(mutation.field)) {
                golden[mutation.field] = mutation.value;
                continue;
              }
              if (mutation.target === 'body' && mutation.field === 'body_hex') {
                golden.body_hex = mutation.value;
                continue;
              }
              if (mutation.target === 'request_header' && contract.forbidden_headers.includes(mutation.field)) {
                forbiddenHeader = true;
                continue;
              }
              throw new Error('unknown private-upload reject mutation: ' + mutation.target + '.' + mutation.field);
            }
            if (golden.method !== contract.method || golden.path !== pu.contract.path) return 'method_path';
            if (forbiddenHeader) return 'forbidden_header';
            if (!canonicalPrivateAuthority(golden.authority)) return 'authority';
            if (!canonicalPrivateNonce(golden.nonce)) return 'nonce';
            if (operation === 'upload' && !/^key_[A-Za-z0-9]{12}$/.test(golden.audience_key_id)) return 'audience_key_id';
            const canonical = Buffer.concat([
              Buffer.from(contract.signing_domain_ascii, 'ascii'),
              Buffer.from([0]),
              ...contract.field_order.map(name => frame(golden[name])),
            ]);
            const inspected = inspectP256Signature(golden.signature_der_b64url);
            if (inspected.rejectClass) return inspected.rejectClass;
            if (!crypto.verify(
              'sha256',
              canonical,
              crypto.createPublicKey({
                key: Buffer.from(pu.fixture_key.public_key_der_b64url, 'base64url'),
                format: 'der',
                type: 'spki',
              }),
              inspected.der,
            )) return 'signature_mismatch';
            const body = Buffer.from(golden.body_hex, 'hex');
            if (crypto.createHash('sha256').update(body).digest('hex') !== golden.body_sha256_hex) {
              return 'body_digest';
            }
            return '';
          };
          const privateUploadMediaTypeValid = value => {
            const pattern = new RegExp(pu.contract.upload.media_type_rule.slice('regex:'.length));
            const subtype = value.includes('/') ? value.slice(value.indexOf('/') + 1) : '';
            return pattern.test(value) && subtype !== '*';
          };
          const privateUploadFilenameInvalid = value => {
            const byteLength = Buffer.byteLength(value, 'utf8');
            return value.normalize('NFC') !== value || byteLength === 0 || byteLength > 180 ||
              value.trim() !== value || value === '.' || value === '..' || /[\\/]/u.test(value) ||
              /[\p{Cc}\p{Cf}\p{Co}\p{Zl}\p{Zp}]/u.test(value);
          };
          const privateUploadConstructionRejects = reject => {
            if (reject.outcome !== 'reject' || reject.base !== 'upload_golden') {
              throw new Error('unknown private-upload construction case');
            }
            if (reject.field === 'content_type' && reject.reject_rule === 'upload.content_type_rule') {
              return reject.value !== pu.upload_golden.media_type;
            }
            if (reject.field === 'display_filename_utf8' && reject.reject_rule === 'upload.display_filename_rule') {
              return privateUploadFilenameInvalid(reject.value);
            }
            if (reject.field === 'media_type' &&
                (reject.reject_rule === 'upload.media_type_rule' ||
                 reject.reject_rule === 'upload.media_type_subtype_rule')) {
              return !privateUploadMediaTypeValid(reject.value);
            }
            throw new Error('unknown private-upload construction field or rule');
          };

          const rawIP = source => {
            const address = source.startsWith('::ffff:') ? source.slice(7) : source;
            if (net.isIPv4(address)) return [4, Buffer.from(address.split('.').map(Number))];
            if (!net.isIPv6(address)) return null;
            const halves = address.split('::');
            const left = halves[0] ? halves[0].split(':') : [];
            const right = halves[1] ? halves[1].split(':') : [];
            const words = [...left, ...Array(8 - left.length - right.length).fill('0'), ...right];
            const raw = Buffer.alloc(16);
            words.forEach((word, index) => raw.writeUInt16BE(Number.parseInt(word, 16), index * 2));
            return [6, raw];
          };
          const verifyHubCookie = vector => {
            const [family, ip] = rawIP(vector.source_ip);
            const ipLength = Buffer.alloc(4);
            const peerLength = Buffer.alloc(4);
            const window = Buffer.alloc(8);
            const peer = Buffer.from(vector.authenticated_peer_public_key_b64, 'base64');
            ipLength.writeUInt32BE(ip.length);
            peerLength.writeUInt32BE(peer.length);
            window.writeBigUInt64BE(BigInt(vector.window_index));
            const preimage = Buffer.concat([
              Buffer.from(hc.contract.cookie_domain_ascii + '\0', 'ascii'),
              Buffer.from([family]),
              ipLength,
              ip,
              peerLength,
              peer,
              window,
            ]);
            const cookie = crypto.createHmac('sha256', Buffer.from(vector.signing_key_hex, 'hex'))
              .update(preimage).digest();
            return preimage.toString('hex') === vector.preimage_hex &&
              cookie.toString('hex') === vector.cookie_hex &&
              cookie.toString('base64') === vector.cookie_b64;
          };
          const crc32c = bytes => {
            let crc = 0xffffffff;
            for (const byte of bytes) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (0x82f63b78 & -(crc & 1));
            }
            return (crc ^ 0xffffffff) >>> 0;
          };
          const base32 = bytes => {
            let bits = 0, value = 0, output = '';
            for (const byte of bytes) {
              value = (value << 8) | byte;
              bits += 8;
              while (bits >= 5) {
                output += cd.contract.alphabet[(value >>> (bits - 5)) & 31];
                bits -= 5;
              }
            }
            return bits ? output + cd.contract.alphabet[(value << (5 - bits)) & 31] : output;
          };
          const verifyCRID = vector => {
            const der = Buffer.from(vector.der_spki_b64url, 'base64url');
            const digest = crypto.createHash('sha256')
              .update(Buffer.concat([
                Buffer.from(cd.contract.domain_separation_prefix, 'ascii'),
                Buffer.from([0]),
                der,
              ])).digest();
            const payload = Buffer.concat([Buffer.from(vector.version_byte, 'hex'), digest]);
            const crc = Buffer.alloc(4);
            crc.writeUInt32BE(crc32c(payload));
            const encoded = Buffer.concat([payload, crc]);
            return digest.toString('hex') === vector.digest_hex &&
              crc.toString('hex') === vector.crc_hex &&
              encoded.toString('hex') === vector.payload_hex &&
              base32(encoded) === vector.expected_crid;
          };

          assert.equal(
            crypto.createPublicKey(crypto.createPrivateKey({
              key: Buffer.from(pu.fixture_key.private_key_pkcs8_der_b64url, 'base64url'),
              format: 'der',
              type: 'pkcs8',
            })).export({ format: 'der', type: 'spki' }).toString('base64url'),
            pu.fixture_key.public_key_der_b64url,
          );
          assert.ok(verifyPrivateUpload('upload', pu.upload_golden));
          assert.ok(verifyPrivateUpload('refresh', pu.refresh_golden));
          assert.equal(privateUploadFilenameInvalid(pu.upload_golden.display_filename_utf8), false);
          assert.equal(privateUploadMediaTypeValid(pu.upload_golden.media_type), true);
          assert.match(pu.upload_golden.audience_key_id, /^key_[A-Za-z0-9]{12}$/);
          assert.match(pu.refresh_golden.upload_handle, /^upl_[A-Za-z0-9_-]{43}$/);
          for (const reject of pu.reject_cases) {
            assert.equal(privateUploadRejectClass(reject), reject.reject_class, reject.name);
          }
          for (const reject of pu.construction_reject_cases) {
            assert.equal(privateUploadConstructionRejects(reject), true, reject.name);
          }
          assert.throws(
            () => privateUploadRejectClass({
              ...pu.reject_cases[0],
              mutations: [{ target: 'request_header', field: 'X-Future-Header', value: 'future' }],
            }),
            /unknown private-upload reject mutation/,
          );
          assert.throws(
            () => privateUploadRejectClass({
              ...pu.reject_cases[0],
              base: 'refresh_golden',
              mutations: [{ target: 'request_field', field: 'audience_key_id', value: 'key_A1b2C3d4E5f6' }],
            }),
            /unknown private-upload reject mutation/,
          );
          assert.ok(hc.cookie_kats.every(verifyHubCookie));
          const acr = c.agentCredentialRecoveryVectors();
          assert.ok(!('private_operations' in acr));
          assert.ok(!('hub_request_id' in acr.fixtures));
          assert.ok(hc.contract.additive_application_profiles.includes(acr.protocol.hub_cookie_contract));
          assert.ok(cd.producer_cases.every(verifyCRID));

          // CRID link knock: the canonical request bytes are defined as
          // JSON.stringify output and the link origin check as a comparison of
          // text, so this runtime re-derives every expectation with the real
          // primitives and then records what a URL parser makes of the same links.
          const lk = c.cridLinkKnockV1Vectors();
          const issuer = c.issuerSignatureVectors();
          assert.equal(lk.artifact, 'qurl-crid-link-knock-v1-vectors');
          assert.equal(lk.schema_version, 1);
          const truncateUserAgent = value => {
            let kept = '';
            for (const character of value) {
              if (Buffer.byteLength(kept + character) > lk.constants.user_agent_max_bytes) break;
              kept += character;
            }
            return kept;
          };
          // A user agent that holds a control character, U+2028 or U+2029 is
          // left out whole. The client looks at the whole string first and
          // truncates after.
          const leavesUserAgentOut = value => [...value].some(character => {
            const codePoint = character.codePointAt(0);
            return codePoint < 0x20 || codePoint === 0x7f || codePoint === 0x2028 || codePoint === 0x2029;
          });
          for (const request of lk.request_cases) {
            const usrData = { [lk.constants.user_data_keys.crid]: request.input.crid };
            if ('user_agent' in request.input && !leavesUserAgentOut(request.input.user_agent)) {
              usrData[lk.constants.user_data_keys.user_agent] = truncateUserAgent(request.input.user_agent);
            }
            const body = {
              headerType: lk.constants.knock_header_type,
              aspId: lk.constants.auth_service_id,
              resId: lk.constants.resource_id,
              usrData,
            };
            assert.equal(JSON.stringify(body), request.serialized, request.name);
            assert.equal(JSON.stringify(request.body), request.serialized, request.name);
            // A request carries the CRID, an optional user agent and nothing
            // else: in particular none of the members it must never carry.
            for (const forbidden of lk.constants.forbidden_user_data_keys) {
              assert.ok(!(forbidden in request.body.usrData), `${request.name} carries ${forbidden}`);
            }
          }
          assert.ok(!lk.constants.forbidden_user_data_keys.some(key => Object.values(lk.constants.user_data_keys).includes(key)));
          // Two cases report a user agent and send none. The second holds
          // nothing wrong in the bytes a client would keep, so it pins the order.
          const leftOut = lk.request_cases.filter(request =>
            'user_agent' in request.input && !(lk.constants.user_data_keys.user_agent in request.body.usrData));
          assert.deepStrictEqual(
            leftOut.map(request => request.name),
            ['user_agent_omitted_for_line_separator', 'user_agent_omitted_before_truncation'],
          );
          assert.ok(!leavesUserAgentOut(truncateUserAgent(leftOut[1].input.user_agent)), leftOut[1].name);
          // The request gate is the CRID v1 local gate plus one rule: the version
          // byte must be an active registry row at that row's digest length,
          // the only kind of CRID a client can verify an issued link against.
          const cridLocalGate = value => {
            const alphabet = cd.contract.alphabet;
            if ([...value].some(character => !alphabet.includes(character))) return { rejectClass: 'charset' };
            if (value.length !== cd.contract.full_crid_length && value.length !== cd.contract.truncated_crid_length) {
              return { rejectClass: 'length' };
            }
            const bytes = [];
            let pending = 0, bits = 0;
            for (const character of value) {
              pending = (pending << 5) | alphabet.indexOf(character);
              bits += 5;
              if (bits >= 8) {
                bits -= 8;
                bytes.push(pending >>> bits);
                pending &= (1 << bits) - 1;
              }
            }
            if (pending !== 0) return { rejectClass: 'non_canonical' };
            const decoded = Buffer.from(bytes);
            const payload = decoded.subarray(0, decoded.length - cd.contract.checksum_length);
            if (decoded.readUInt32BE(payload.length) !== crc32c(payload)) return { rejectClass: 'checksum' };
            const versionHex = payload.subarray(0, 1).toString('hex');
            if (versionHex === cd.contract.forbidden_version_hex) return { rejectClass: 'version' };
            return { rejectClass: '', versionHex, digestLength: payload.length - 1 };
          };
          const cridRequestRejectClass = value => {
            const gate = cridLocalGate(value);
            if (gate.rejectClass) return gate.rejectClass;
            const row = cd.versions.find(version => version.version_hex === gate.versionHex);
            return row && row.status === 'active' && row.digest_length === gate.digestLength ? '' : 'version';
          };
          for (const value of cd.consumer_value_cases) {
            assert.equal(cridLocalGate(value.value).rejectClass, value.reject_class ?? '', value.name);
          }
          for (const refused of lk.invalid_request_cases) {
            assert.equal(refused.outcome, 'reject', refused.name);
            assert.equal(cridRequestRejectClass(refused.input.crid), refused.crid_reject_class, refused.name);
          }
          // Three refused inputs pass the CRID v1 gate and are refused for their
          // version alone: one unregistered byte and the two reserved bytes.
          const unverifiable = lk.invalid_request_cases.filter(refused => cridLocalGate(refused.input.crid).rejectClass === '');
          assert.deepStrictEqual(
            unverifiable.map(refused => [refused.name, cridLocalGate(refused.input.crid).versionHex, refused.input.crid.length]),
            [
              ['reject_unregistered_version', '7f', cd.contract.full_crid_length],
              ['reject_reserved_version_02', '02', cd.contract.truncated_crid_length],
              ['reject_reserved_version_82', '82', cd.contract.truncated_crid_length],
            ],
          );
          assert.ok(unverifiable.every(refused => refused.crid_reject_class === 'version'));
          for (const requested of [
            ...lk.request_cases.map(request => request.input.crid),
            ...lk.ack_cases.map(ackCase => ackCase.requested_crid),
            ...lk.client_verification_cases.map(check => check.requested_crid),
          ]) {
            assert.equal(cridRequestRejectClass(requested), '', requested);
          }
          const cridFromKey = (keyB64, held) => {
            const version = (cd.contract.alphabet.indexOf(held[0]) << 3) | (cd.contract.alphabet.indexOf(held[1]) >> 2);
            const digest = crypto.createHash('sha256')
              .update(Buffer.concat([
                Buffer.from(cd.contract.domain_separation_prefix, 'ascii'),
                Buffer.from([0]),
                Buffer.from(keyB64, 'base64url'),
              ])).digest();
            const payload = Buffer.concat([Buffer.from([version]), digest]);
            const crc = Buffer.alloc(4);
            crc.writeUInt32BE(crc32c(payload));
            return base32(Buffer.concat([payload, crc]));
          };
          const issuerKey = crypto.createPublicKey({ key: issuer.issuer.jwk, format: 'jwk' });
          const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          // Checks 2 and 3 compare text. An issued link is the link origin, an
          // optional slash, a number sign and the fragment. It is not parsed as
          // a URL first: a parser lower-cases the scheme and the host and drops
          // a default port, so it reads other spellings as the same origin.
          const splitLink = redirect => {
            const origin = lk.constants.link_origin;
            if (!redirect.startsWith(origin)) return { rejectClass: 'origin' };
            const numberSign = redirect.indexOf('#');
            const location = redirect.slice(origin.length, numberSign === -1 ? redirect.length : numberSign);
            if (location !== '' && location !== '/') {
              return { rejectClass: location[0] === '/' || location[0] === '?' ? 'path_or_query' : 'origin' };
            }
            return { rejectClass: '', fragment: numberSign === -1 ? '' : redirect.slice(numberSign + 1) };
          };
          const linkRejectClass = (requested, ack) => {
            const redirect = ack.redirectUrl;
            if (typeof redirect !== 'string' || redirect === '') return 'missing_redirect';
            const split = splitLink(redirect);
            if (split.rejectClass) return split.rejectClass;
            const parts = split.fragment.split('.');
            const counts = parts.slice(1, 4).map(Number);
            if (parts[0] !== 'qv2t1' || parts.length !== 4 + counts[0] + counts[1] + counts[2]) return 'transport';
            const claims = parts.slice(4, 4 + counts[0]).join('');
            const signed = Buffer.concat([
              Buffer.from(issuer.domain_separation_prefix, 'ascii'),
              Buffer.from([0]),
              Buffer.from(claims, 'ascii'),
            ]);
            if (!crypto.verify(
              'sha256',
              signed,
              { key: issuerKey, dsaEncoding: 'ieee-p1363' },
              Buffer.from(parts.at(-1), 'base64url'),
            )) return 'issuer_signature';
            const resourceKey = JSON.parse(Buffer.from(claims, 'base64url')).resource_public_key_b64;
            if (cridFromKey(resourceKey, requested) !== requested) return 'crid_mismatch';
            if (isObject(ack.redirectInfo) && 'crid' in ack.redirectInfo && ack.redirectInfo.crid !== requested) {
              return 'info_crid_mismatch';
            }
            return '';
          };
          // One cap for every display string: kept only when it is a non-empty
          // string of at most info_text_max_code_points code points, never shortened.
          const isInfoText = value => typeof value === 'string' && value !== '' &&
            [...value].length <= lk.constants.info_text_max_code_points;
          assert.equal(lk.constants.info_text_max_code_points, 128);
          const sanitizeRedirectInfo = raw => {
            const source = isObject(raw) ? raw : {};
            const info = {};
            for (const member of ['qurl_id', 'expires_at', 'resource_created_at']) {
              if (isInfoText(source[member])) info[member] = source[member];
            }
            const publisher = isObject(source.publisher) ? source.publisher : {};
            info.publisher = {};
            if (isInfoText(publisher.name)) info.publisher.name = publisher.name;
            info.publisher.verified = publisher.verified === true;
            return info;
          };
          const interpretAck = (requested, ack) => {
            if (typeof ack.errCode !== 'string' || ack.errCode === '' || ack.errCode === '0') {
              return { client_result: 'protocol_violation' };
            }
            if (!Object.hasOwn(lk.error_codes, ack.errCode)) return { client_result: 'server_error' };
            const result = lk.error_codes[ack.errCode].client_result;
            if (result !== 'link') return { client_result: result };
            const rejectClass = linkRejectClass(requested, ack);
            if (rejectClass) return { reject_class: rejectClass };
            return { client_result: result, link: ack.redirectUrl, info: sanitizeRedirectInfo(ack.redirectInfo) };
          };
          // The packet header type is read before any body: only an ACK has an
          // outcome code, the cookie reply is busy, anything else is a transport
          // error and not a client result.
          const replyRules = lk.reply_type_rules;
          assert.deepStrictEqual(Object.keys(replyRules), ['ack', 'cookie', 'other']);
          assert.deepStrictEqual(replyRules.ack, {
            header_type: lk.constants.ack_header_type,
            is_ack: true,
            carries_outcome_code: true,
            handling: 'interpret_ack_body',
          });
          assert.deepStrictEqual(replyRules.cookie, {
            header_type: lk.constants.cookie_header_type,
            is_ack: false,
            carries_outcome_code: false,
            handling: 'client_result',
            client_result: 'busy',
          });
          assert.deepStrictEqual(replyRules.other, { is_ack: false, carries_outcome_code: false, handling: 'transport_error' });
          assert.equal(lk.constants.cookie_header_type, 7);
          const interpretReply = (headerType, requested, body) => {
            const rule = Object.values(replyRules).find(candidate => candidate.header_type === headerType) ?? replyRules.other;
            if (rule.handling === 'interpret_ack_body') return interpretAck(requested, body);
            if (rule.handling === 'client_result') return { client_result: rule.client_result };
            return { transport_error: true };
          };
          for (const ackCase of lk.ack_cases) {
            assert.deepStrictEqual(
              interpretReply(lk.constants.ack_header_type, ackCase.requested_crid, ackCase.body),
              ackCase.expected,
              ackCase.name,
            );
          }
          const issued = lk.ack_cases.find(ackCase => ackCase.name === 'link_issued');
          assert.deepStrictEqual(
            interpretReply(lk.constants.cookie_header_type, issued.requested_crid, issued.body),
            { client_result: 'busy' },
          );
          assert.deepStrictEqual(
            interpretReply(lk.constants.knock_header_type, issued.requested_crid, issued.body),
            { transport_error: true },
          );
          const ackResults = new Set(lk.ack_cases.map(ackCase => ackCase.expected.client_result));
          assert.ok(!ackResults.has(replyRules.cookie.client_result));
          assert.deepStrictEqual([...ackResults, replyRules.cookie.client_result].sort(), [...lk.client_results].sort());
          for (const check of lk.client_verification_cases) {
            const result = interpretAck(check.requested_crid, check.body);
            assert.equal(result.client_result === 'link' ? 'accept' : 'reject', check.outcome, check.name);
            assert.equal(result.reject_class, check.reject_class, check.name);
          }
          // What the WHATWG URL parser makes of the same links. It agrees with
          // the text comparison on every link the comparison lets through. It
          // also reads six of the rejected links as the bare link on the link
          // origin: three respelled origins, a host with a tab in it, an empty
          // query and a dot segment. It puts one more rejected link on the link
          // origin, with a path: the link with a backslash after the host.
          // That is why a client compares text and does not parse.
          const parsesOnLinkOrigin = url =>
            url.origin === lk.constants.link_origin && url.username === '' && url.password === '';
          const parsesAsBareLinkOnOrigin = url =>
            parsesOnLinkOrigin(url) && url.pathname === '/' && url.search === '';
          const parserWouldAccept = [];
          const parserReadsLinkOriginWithPath = [];
          const parserRefuses = [];
          for (const check of lk.client_verification_cases) {
            const redirect = check.body.redirectUrl;
            if (typeof redirect !== 'string' || redirect === '') continue;
            let url;
            try {
              url = new URL(redirect);
            } catch {
              parserRefuses.push(check.name);
              continue;
            }
            if (splitLink(redirect).rejectClass === '') {
              assert.ok(parsesAsBareLinkOnOrigin(url), check.name);
            } else if (parsesAsBareLinkOnOrigin(url)) {
              parserWouldAccept.push([check.name, check.reject_class]);
            } else if (check.reject_class === 'origin' && parsesOnLinkOrigin(url)) {
              parserReadsLinkOriginWithPath.push([check.name, url.pathname]);
            }
          }
          // The parser reads every link of the suite. One it refuses to read
          // fails here, by name.
          assert.deepStrictEqual(parserRefuses, []);
          assert.deepStrictEqual(parserWouldAccept, [
            ['reject_origin_uppercase_scheme', 'origin'],
            ['reject_origin_uppercase_host', 'origin'],
            ['reject_origin_default_port', 'origin'],
            ['reject_origin_tab_in_host', 'origin'],
            ['reject_empty_query', 'path_or_query'],
            ['reject_dot_segment', 'path_or_query'],
          ]);
          // The parser reads the backslash as a slash. A client that parses
          // first and compares only the origin accepts this link; one that
          // also looks at the path refuses it, but as path_or_query.
          assert.deepStrictEqual(parserReadsLinkOriginWithPath, [['reject_origin_backslash', '/@example.com/']]);
          // Both accepted forms are pinned: with the slash and without it.
          assert.deepStrictEqual(
            lk.client_verification_cases
              .filter(check => check.outcome === 'accept')
              .map(check => check.body.redirectUrl.slice(lk.constants.link_origin.length, check.body.redirectUrl.indexOf('#') + 1))
              .filter((form, index, forms) => forms.indexOf(form) === index)
              .sort(),
            ['#', '/#'],
          );
          for (const sanitization of lk.redirect_info_sanitization_cases) {
            assert.deepStrictEqual(sanitizeRedirectInfo(sanitization.redirect_info), sanitization.expected, sanitization.name);
          }
          assert.deepStrictEqual(
            [...new Set(lk.client_verification_cases.map(check => check.reject_class).filter(Boolean))].sort(),
            [...lk.reject_classes].sort(),
          );
          console.log('npm ok');
          NODE

          tarball=$(npm pack ./npm --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/qurl-conformance-npm-smoke"
          cd "$RUNNER_TEMP/qurl-conformance-npm-smoke"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$tarball" >/dev/null
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const c = require('@layervai/qurl-conformance');
          const crid = require('@layervai/qurl-conformance/crid_v1_vectors.json');
          assert.deepEqual(c.cridV1Vectors(), crid);
          console.log('npm tarball exports ok');
          NODE

      - name: Set up Python for package smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Python package smoke
        run: |
          cd python
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import ipaddress
          import json
          from pathlib import Path
          import re
          import struct
          import unicodedata

          import qurl_conformance as q

          files = {
              'qv2_vectors': 'qv2_conformance_vectors.json',
              'issuer_signature_vectors': 'issuer_signature_vectors.json',
              'relay_knock_vectors': 'relay_knock_golden.json',
              'agent_registration_vectors': 'agent_registration_golden.json',
              'agent_assignment_vectors': 'agent_assignment_golden.json',
              'agent_knock_application_vectors': 'agent_knock_application_vectors.json',
              'agent_session_control_vectors': 'agent_session_control_vectors.json',
              'agent_api_key_id_vectors': 'agent_api_key_id_vectors.json',
              'assignment_ticket_vectors': 'assignment_ticket_v1_vectors.json',
              'connector_resource_lst_v1_vectors': 'connector_resource_lst_v1_vectors.json',
              'connector_hub_lst_cookie_vectors': 'connector_hub_lst_cookie_v1_vectors.json',
              'agent_credential_recovery_vectors': 'agent_credential_recovery_v1_vectors.json',
              'crid_v1_vectors': 'crid_v1_vectors.json',
              'crid_link_knock_v1_vectors': 'crid_link_knock_v1_vectors.json',
              'target_path_v1_vectors': 'target_path_v1_vectors.json',
              'private_upload_v1_vectors': 'private_upload_v1_vectors.json',
          }
          assert {
              name for name, value in vars(q).items()
              if name.endswith('_vectors') and callable(value)
          } == set(files)
          assert {path.name for path in Path('qurl_conformance/_data').glob('*.json')} == set(files.values())
          for accessor, file in files.items():
              expected = json.loads((Path('qurl_conformance/_data') / file).read_text())
              assert getattr(q, accessor)() == expected

          hc = q.connector_hub_lst_cookie_vectors()
          cd = q.crid_v1_vectors()
          pu = q.private_upload_v1_vectors()

          assert pu['contract']['audience_key_id_rule'] == 'regex:^key_[A-Za-z0-9]{12}$'
          assert pu['contract']['client_id_rule'] == 'regex:^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          assert pu['contract']['key_id_rule'] == 'regex:^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          assert pu['contract']['upload_request_id_rule'] == 'regex:^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          assert pu['contract']['upload_handle_rule'] == 'regex:^upl_[A-Za-z0-9_-]{43}$'
          assert pu['contract']['authority_expires_at_rule'] == 'rfc3339_utc_whole_seconds_uppercase_z'
          assert pu['contract']['body_length_rule'] == 'positive_canonical_decimal_equal_to_exact_body_byte_length'
          assert pu['contract']['upload']['media_type_rule'].startswith('regex:^')
          assert pu['contract']['upload']['media_type_subtype_rule'] == 'not_exactly_star'
          assert pu['contract']['upload']['filename_encoding'] == 'utf8_then_base64url_unpadded'
          assert pu['contract']['upload']['display_filename_rule'] == (
              'nfc_utf8_1_to_180_bytes_no_leading_or_trailing_unicode_whitespace_not_dot_or_dotdot_'
              'no_slash_or_backslash_no_unicode_control_cf_co_zl_or_zp'
          )
          assert pu['contract']['upload']['content_type_rule'] == 'exactly_equal_to_signed_media_type'
          assert pu['contract']['refresh']['body_key_order'] == [
              'upload_handle',
              'upload_request_id',
              'max_batch_size',
              'max_link_ttl_seconds',
              'authority_expires_at',
          ]
          assert pu['contract']['refresh']['body_whitespace_rule'] == 'none_between_tokens'
          assert pu['contract']['refresh']['body_string_escaping_rule'] == (
              'rfc8259_utf8_short_escapes_for_quote_backslash_backspace_tab_newline_formfeed_carriage_return_'
              'u00xx_for_other_u0000_to_u001f_controls_plus_lowercase_u003c_u003e_u0026_u2028_u2029'
          )
          assert pu['contract']['refresh']['content_type_rule'] == 'exactly_application/json'

          def frame(value):
              encoded = str(value).encode()
              return struct.pack('>I', len(encoded)) + encoded

          def verify_private_upload(operation, golden):
              contract = pu['contract'][operation]
              body = bytes.fromhex(golden['body_hex'])
              body_hash = hashlib.sha256(body).hexdigest()
              values = dict(golden)
              values['body_sha256_hex'] = body_hash
              canonical = b''.join((
                  contract['signing_domain_ascii'].encode('ascii'),
                  b'\0',
                  *(frame(values[name]) for name in contract['field_order']),
              ))
              expected_refresh_body = None
              if operation == 'refresh':
                  if not re.fullmatch(r'[1-9][0-9]*', golden['max_batch_size_decimal']):
                      return False
                  if not re.fullmatch(r'[1-9][0-9]*', golden['max_link_ttl_seconds_decimal']):
                      return False

                  def canonical_string(value):
                      return (
                          json.dumps(value, ensure_ascii=False, separators=(',', ':'))
                          .replace('<', r'\u003c')
                          .replace('>', r'\u003e')
                          .replace('&', r'\u0026')
                          .replace('\u2028', r'\u2028')
                          .replace('\u2029', r'\u2029')
                      )

                  expected_refresh_body = (
                      '{"upload_handle":' + canonical_string(golden['upload_handle'])
                      + ',"upload_request_id":' + canonical_string(golden['upload_request_id'])
                      + ',"max_batch_size":' + golden['max_batch_size_decimal']
                      + ',"max_link_ttl_seconds":' + golden['max_link_ttl_seconds_decimal']
                      + ',"authority_expires_at":' + canonical_string(golden['authority_expires_at'])
                      + '}'
                  ).encode()
              stable = b''.join((
                  contract['stable_request_domain_ascii'].encode('ascii'),
                  b'\0',
                  *(frame(golden[name]) for name in contract['stable_request_field_order']),
              ))
              return (
                  str(len(body)) == golden['body_length_decimal']
                  and body_hash == golden['body_sha256_hex']
                  and 'sha-256=:' + base64.b64encode(hashlib.sha256(body).digest()).decode() + ':' == golden['content_digest_header']
                  and canonical.hex() == golden['canonical_hex']
                  and hashlib.sha256(canonical).hexdigest() == golden['signing_digest_hex']
                  and stable.hex() == golden['stable_request_canonical_hex']
                  and hashlib.sha256(stable).hexdigest() == golden['stable_request_digest_hex']
                  and (operation != 'upload' or golden['content_type'] == golden['media_type'])
                  and (
                      operation != 'refresh'
                      or (golden['content_type'] == 'application/json' and expected_refresh_body == body)
                  )
                  and (
                      operation != 'upload'
                      or base64.urlsafe_b64encode(golden['display_filename_utf8'].encode()).decode().rstrip('=')
                      == golden['filename_b64url']
                  )
              )

          def private_upload_media_type_valid(value):
              pattern = pu['contract']['upload']['media_type_rule'].removeprefix('regex:')
              _, separator, subtype = value.partition('/')
              return re.fullmatch(pattern, value) is not None and bool(separator) and subtype != '*'

          def private_upload_filename_invalid(value):
              return (
                  unicodedata.normalize('NFC', value) != value
                  or not value
                  or len(value.encode()) > 180
                  or value.strip() != value
                  or value in ('.', '..')
                  or '/' in value
                  or '\\' in value
                  or any(unicodedata.category(char) in ('Cc', 'Cf', 'Co', 'Zl', 'Zp') for char in value)
              )

          def private_upload_construction_rejects(reject):
              if reject['outcome'] != 'reject' or reject['base'] != 'upload_golden':
                  raise ValueError('unknown private-upload construction case')
              if reject['field'] == 'content_type' and reject['reject_rule'] == 'upload.content_type_rule':
                  return reject['value'] != pu['upload_golden']['media_type']
              if reject['field'] == 'display_filename_utf8' and reject['reject_rule'] == 'upload.display_filename_rule':
                  return private_upload_filename_invalid(reject['value'])
              if reject['field'] == 'media_type' and reject['reject_rule'] in (
                  'upload.media_type_rule',
                  'upload.media_type_subtype_rule',
              ):
                  return not private_upload_media_type_valid(reject['value'])
              raise ValueError('unknown private-upload construction field or rule')

          def verify_hub_cookie(vector):
              address = ipaddress.ip_address(vector['source_ip'])
              if isinstance(address, ipaddress.IPv6Address) and address.ipv4_mapped:
                  address = address.ipv4_mapped
              peer = base64.b64decode(vector['authenticated_peer_public_key_b64'], validate=True)
              preimage = b''.join((
                  hc['contract']['cookie_domain_ascii'].encode('ascii'),
                  b'\0',
                  bytes([address.version]),
                  struct.pack('>I', len(address.packed)),
                  address.packed,
                  struct.pack('>I', len(peer)),
                  peer,
                  struct.pack('>Q', int(vector['window_index'])),
              ))
              cookie = hmac.new(
                  bytes.fromhex(vector['signing_key_hex']),
                  preimage,
                  hashlib.sha256,
              ).digest()
              return (
                  preimage.hex() == vector['preimage_hex']
                  and cookie.hex() == vector['cookie_hex']
                  and base64.b64encode(cookie).decode() == vector['cookie_b64']
              )

          def crc32c(data):
              crc = 0xffffffff
              for byte in data:
                  crc ^= byte
                  for _ in range(8):
                      crc = (crc >> 1) ^ (0x82f63b78 * (crc & 1))
              return crc ^ 0xffffffff

          def verify_crid(vector):
              der = base64.urlsafe_b64decode(vector['der_spki_b64url'] + '==')
              digest = hashlib.sha256(
                  cd['contract']['domain_separation_prefix'].encode('ascii') + b'\0' + der
              ).digest()
              payload = bytes.fromhex(vector['version_byte']) + digest
              crc = struct.pack('>I', crc32c(payload))
              encoded = payload + crc
              return (
                  digest.hex() == vector['digest_hex']
                  and crc.hex() == vector['crc_hex']
                  and encoded.hex() == vector['payload_hex']
                  and base64.b32encode(encoded).decode().rstrip('=').lower() == vector['expected_crid']
              )

          assert verify_private_upload('upload', pu['upload_golden'])
          assert verify_private_upload('refresh', pu['refresh_golden'])
          assert not private_upload_filename_invalid(pu['upload_golden']['display_filename_utf8'])
          assert private_upload_media_type_valid(pu['upload_golden']['media_type'])
          assert all(private_upload_construction_rejects(reject) for reject in pu['construction_reject_cases'])
          assert re.fullmatch(r'key_[A-Za-z0-9]{12}', pu['upload_golden']['audience_key_id'])
          assert re.fullmatch(r'upl_[A-Za-z0-9_-]{43}', pu['refresh_golden']['upload_handle'])
          assert all(verify_hub_cookie(vector) for vector in hc['cookie_kats'])
          acr = q.agent_credential_recovery_vectors()
          assert 'private_operations' not in acr
          assert 'hub_request_id' not in acr['fixtures']
          assert acr['protocol']['hub_cookie_contract'] in hc['contract']['additive_application_profiles']
          assert all(verify_crid(vector) for vector in cd['producer_cases'])

          # CRID link knock: re-derive the canonical request bytes with this
          # runtime's serializer, tie the fixture link to its CRIDs, and
          # re-run the display-metadata gate.
          lk = q.crid_link_knock_v1_vectors()
          assert lk['artifact'] == 'qurl-crid-link-knock-v1-vectors' and lk['schema_version'] == 1

          def truncate_user_agent(value):
              kept = ''
              for character in value:
                  if len((kept + character).encode()) > lk['constants']['user_agent_max_bytes']:
                      break
                  kept += character
              return kept

          # A user agent that holds a control character, U+2028 or U+2029 is
          # left out whole. The client looks at the whole string first and
          # truncates after.
          def leaves_user_agent_out(value):
              return any(ord(character) < 0x20 or ord(character) in (0x7f, 0x2028, 0x2029) for character in value)

          for request in lk['request_cases']:
              user_data = {lk['constants']['user_data_keys']['crid']: request['input']['crid']}
              if 'user_agent' in request['input'] and not leaves_user_agent_out(request['input']['user_agent']):
                  user_data[lk['constants']['user_data_keys']['user_agent']] = truncate_user_agent(
                      request['input']['user_agent']
                  )
              built = {
                  'headerType': lk['constants']['knock_header_type'],
                  'aspId': lk['constants']['auth_service_id'],
                  'resId': lk['constants']['resource_id'],
                  'usrData': user_data,
              }
              for body in (built, request['body']):
                  assert json.dumps(body, separators=(',', ':'), ensure_ascii=False) == request['serialized'], request['name']
          # Two cases report a user agent and send none. The second holds
          # nothing wrong in the bytes a client would keep, so it pins the order.
          left_out = [
              request for request in lk['request_cases']
              if 'user_agent' in request['input']
              and lk['constants']['user_data_keys']['user_agent'] not in request['body']['usrData']
          ]
          assert [request['name'] for request in left_out] == [
              'user_agent_omitted_for_line_separator',
              'user_agent_omitted_before_truncation',
          ]
          assert not leaves_user_agent_out(truncate_user_agent(left_out[1]['input']['user_agent'])), left_out[1]['name']

          # The request gate is the CRID v1 local gate plus one rule: the version
          # byte must be an active registry row at that row's digest length,
          # the only kind of CRID a client can verify an issued link against.
          def crid_local_gate(value):
              alphabet = cd['contract']['alphabet']
              if any(character not in alphabet for character in value):
                  return 'charset', None, None
              if len(value) not in (cd['contract']['full_crid_length'], cd['contract']['truncated_crid_length']):
                  return 'length', None, None
              number = 0
              for character in value:
                  number = (number << 5) | alphabet.index(character)
              spare_bits = len(value) * 5 % 8
              if number & ((1 << spare_bits) - 1):
                  return 'non_canonical', None, None
              decoded = (number >> spare_bits).to_bytes(len(value) * 5 // 8, 'big')
              payload = decoded[:-cd['contract']['checksum_length']]
              if struct.unpack('>I', decoded[len(payload):])[0] != crc32c(payload):
                  return 'checksum', None, None
              version_hex = payload[:1].hex()
              if version_hex == cd['contract']['forbidden_version_hex']:
                  return 'version', None, None
              return '', version_hex, len(payload) - 1

          def crid_request_reject_class(value):
              reject_class, version_hex, digest_length = crid_local_gate(value)
              if reject_class:
                  return reject_class
              verifiable = any(
                  row['version_hex'] == version_hex and row['status'] == 'active' and row['digest_length'] == digest_length
                  for row in cd['versions']
              )
              return '' if verifiable else 'version'

          for value in cd['consumer_value_cases']:
              assert crid_local_gate(value['value'])[0] == value.get('reject_class', ''), value['name']
          for refused in lk['invalid_request_cases']:
              assert refused['outcome'] == 'reject', refused['name']
              assert crid_request_reject_class(refused['input']['crid']) == refused['crid_reject_class'], refused['name']
          # Three refused inputs pass the CRID v1 gate and are refused for their
          # version alone: one unregistered byte and the two reserved bytes.
          unverifiable = [
              refused for refused in lk['invalid_request_cases'] if crid_local_gate(refused['input']['crid'])[0] == ''
          ]
          assert [
              (refused['name'], crid_local_gate(refused['input']['crid'])[1], len(refused['input']['crid']))
              for refused in unverifiable
          ] == [
              ('reject_unregistered_version', '7f', cd['contract']['full_crid_length']),
              ('reject_reserved_version_02', '02', cd['contract']['truncated_crid_length']),
              ('reject_reserved_version_82', '82', cd['contract']['truncated_crid_length']),
          ]
          assert all(refused['crid_reject_class'] == 'version' for refused in unverifiable)
          requested_crids = (
              [request['input']['crid'] for request in lk['request_cases']]
              + [case['requested_crid'] for case in lk['ack_cases']]
              + [case['requested_crid'] for case in lk['client_verification_cases']]
          )
          assert all(crid_request_reject_class(crid) == '' for crid in requested_crids)

          link_parts = lk['fixtures']['link'].removeprefix(lk['constants']['link_origin'] + '/#').split('.')
          assert link_parts[0] == 'qv2t1'
          link_claims_b64 = ''.join(link_parts[4:4 + int(link_parts[1])])
          link_claims = json.loads(base64.urlsafe_b64decode(link_claims_b64 + '=' * (-len(link_claims_b64) % 4)))
          assert link_claims['resource_public_key_b64'] == lk['fixtures']['resource_public_key_b64']
          link_resource_der = base64.urlsafe_b64decode(lk['fixtures']['resource_public_key_b64'] + '==')
          link_resource_digest = hashlib.sha256(
              cd['contract']['domain_separation_prefix'].encode('ascii') + bytes(1) + link_resource_der
          ).digest()
          for version, crid in ((0x01, lk['fixtures']['crid']), (0x81, lk['fixtures']['test_environment_crid'])):
              payload = bytes([version]) + link_resource_digest
              encoded = payload + struct.pack('>I', crc32c(payload))
              assert base64.b32encode(encoded).decode().rstrip('=').lower() == crid

          # One cap for every display string: kept only when it is a non-empty
          # string of at most info_text_max_code_points code points, never shortened.
          assert lk['constants']['info_text_max_code_points'] == 128

          def is_info_text(value):
              return isinstance(value, str) and 0 < len(value) <= lk['constants']['info_text_max_code_points']

          def sanitize_redirect_info(raw):
              source = raw if isinstance(raw, dict) else {}
              info = {
                  member: source[member]
                  for member in ('qurl_id', 'expires_at', 'resource_created_at')
                  if is_info_text(source.get(member))
              }
              publisher = source.get('publisher') if isinstance(source.get('publisher'), dict) else {}
              info['publisher'] = {'verified': publisher.get('verified') is True}
              if is_info_text(publisher.get('name')):
                  info['publisher']['name'] = publisher['name']
              return info

          for case in lk['redirect_info_sanitization_cases']:
              assert sanitize_redirect_info(case['redirect_info']) == case['expected'], case['name']

          # The packet header type is read before any body: only an ACK has an
          # outcome code, the cookie reply is busy, anything else is a
          # transport error and not a client result.
          reply_rules = lk['reply_type_rules']
          assert list(reply_rules) == ['ack', 'cookie', 'other']
          assert reply_rules['ack'] == {
              'header_type': lk['constants']['ack_header_type'],
              'is_ack': True,
              'carries_outcome_code': True,
              'handling': 'interpret_ack_body',
          }
          assert reply_rules['cookie'] == {
              'header_type': lk['constants']['cookie_header_type'],
              'is_ack': False,
              'carries_outcome_code': False,
              'handling': 'client_result',
              'client_result': 'busy',
          }
          assert reply_rules['other'] == {'is_ack': False, 'carries_outcome_code': False, 'handling': 'transport_error'}
          # Dictionary equality treats 1 and 0 as True and False; the flags must be real booleans.
          assert reply_rules['ack']['is_ack'] is True and reply_rules['ack']['carries_outcome_code'] is True
          assert all(
              reply_rules[kind][flag] is False
              for kind in ('cookie', 'other')
              for flag in ('is_ack', 'carries_outcome_code')
          )
          assert lk['constants']['cookie_header_type'] == 7

          def interpret_reply(header_type, body):
              rule = next(
                  (candidate for candidate in reply_rules.values() if candidate.get('header_type') == header_type),
                  reply_rules['other'],
              )
              if rule['handling'] == 'client_result':
                  return rule['client_result']
              if rule['handling'] != 'interpret_ack_body':
                  return 'transport error, not a client result'
              code = body.get('errCode')
              if not isinstance(code, str) or code in ('', '0'):
                  return 'protocol_violation'
              return lk['error_codes'].get(code, {'client_result': 'server_error'})['client_result']

          for case in lk['ack_cases']:
              result = interpret_reply(lk['constants']['ack_header_type'], case['body'])
              assert result == case['expected']['client_result'], case['name']
              if result == 'link':
                  assert case['expected']['link'] == case['body']['redirectUrl'] == lk['fixtures']['link'], case['name']
                  assert sanitize_redirect_info(case['body'].get('redirectInfo')) == case['expected']['info'], case['name']
              else:
                  assert 'link' not in case['expected'] and 'info' not in case['expected'], case['name']
          issued = next(case for case in lk['ack_cases'] if case['name'] == 'link_issued')
          assert interpret_reply(lk['constants']['cookie_header_type'], issued['body']) == 'busy'
          assert interpret_reply(lk['constants']['knock_header_type'], issued['body']) not in lk['client_results']
          ack_results = {case['expected']['client_result'] for case in lk['ack_cases']}
          assert reply_rules['cookie']['client_result'] not in ack_results
          assert ack_results | {reply_rules['cookie']['client_result']} == set(lk['client_results'])
          assert {
              case['reject_class'] for case in lk['client_verification_cases'] if case['outcome'] == 'reject'
          } == set(lk['reject_classes'])
          print('py ok')
          PY

          python -m pip install --quiet .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import qurl_conformance as q

          accessors = [
              value for name, value in vars(q).items()
              if name.endswith('_vectors') and callable(value)
          ]
          assert accessors
          for accessor in accessors:
              accessor()
          print('python wheel ok')
          PY
  # Slack build-completion card. Thin shim over the public fleet-shared
  # reusable workflow. The Block Kit payload builder and gate-result aggregation
  # live there. Adding/removing a gate is a one-line edit to `needs:` + `gates:`
  # here.
  notify:
    name: Notify
    needs: [conformance]
    # `!cancelled()` rather than `always()`: this repo sets
    # concurrency.cancel-in-progress, so a newer push to main cancels the
    # in-flight run. `always()` would still post a yellow "cancelled" card for
    # every superseded push. We notify on success and failure; we stay quiet
    # only when the run is cancelled out from under us. Skipped on PRs.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions: {}
    uses: layervai/ops-routines-workflows/.github/workflows/notify.yml@d07fa2fe3a103907ff2b1a1a71509a6dcd8e9d32 # v0.13.0
    with:
      header: "qURL Conformance Build"
      gates: '{"Conformance": "${{ needs.conformance.result }}"}'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
