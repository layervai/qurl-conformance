name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: vectors + go + cross-language
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Claude workflow dependency lockstep
        run: python3 scripts/check-claude-model-lockstep.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Root module — test/vet/fmt
        run: |
          # go.mod is the root compatibility source of truth. This equality
          # proves setup-go selected the exact patch named there rather than
          # floating within that minor series — so CI exercises the declared
          # floor itself, which is the version downstream consumers are
          # promised. It deliberately assumes go.mod has no toolchain directive.
          expected_go="go$(awk '$1 == "go" { print $2 }' go.mod)"
          test "$(go env GOVERSION)" = "$expected_go"
          go test ./...
          go vet ./...
          if [ -n "$(gofmt -l .)" ]; then echo "::error::gofmt"; gofmt -l .; exit 1; fi

      - name: Root module must be dependency-free
        run: |
          if grep -qE '^[[:space:]]*require[[:space:]]' go.mod; then
            echo "::error::root go.mod must have no require directive (zero-dep embed module)"; grep -n require go.mod; exit 1
          fi

      - name: Sanitizer gate (no private-repo leakage in vectors/docs/packages)
        run: |
          if grep -rInE 'nhp-OWNED|nhp-owned|endpoints/server/internal|endpoints/js-agent|layervai/nhp|nhp/core|\bvendored\b|vendoring' vectors/ npm/vectors/ python/qurl_conformance/_data/ README.md 2>/dev/null; then
            echo "::error::private-repo leak term found"; exit 1
          fi

      - name: Vector byte-identity (root == npm == python)
        run: bash scripts/check-sync.sh

      - name: Set up Node for npm package smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: npm package smoke
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const net = require('node:net');
          const c = require('./npm');
          const qv2 = c.qv2Vectors();
          const r = c.relayKnockVectors();
          const a = c.agentRegistrationVectors();
          const s = c.agentAssignmentVectors();
          const k = c.agentKnockApplicationVectors();
          const x = c.agentSessionControlVectors();
          const i = c.agentApiKeyIdVectors();
          const t = c.assignmentTicketVectors();
          const u = c.connectorAuthorityLambdaVectors();
          const rr = c.connectorResourceLstV1Vectors();
          const h = c.connectorHubRequestIdVectors();
          const hc = c.connectorHubLstCookieVectors();
          const cr = c.agentCredentialRecoveryVectors();
          const cd = c.cridV1Vectors();
          const tp = c.targetPathV1Vectors();
          const dm = c.delegatedMintIssueV1Vectors();
          const dmRejects = Object.fromEntries(dm.reject_cases.map(v => [v.name, v]));
          const dmSignedInputs = [dm.golden, dm.retry_golden, dm.refresh_golden,
            dm.wrong_endpoint_signed, dm.nonce_reuse_signed, dm.authority_conflict_signed];
          const dmKIDPublicKeys = new Map();
          const dmKIDMappingValid = dmSignedInputs.every(v => {
            const prior = dmKIDPublicKeys.get(v.kid);
            if (prior !== undefined && prior !== v.public_key_der_b64url) return false;
            dmKIDPublicKeys.set(v.kid, v.public_key_der_b64url);
            return true;
          });
          const dmNonceReuseState = dm.state_cases.find(v => v.name === 'reused_nonce_across_operation');
          const dmRejectResponses = {
            authority: '403/invalid_capability_issue',
            body_size: '413/payload_too_large',
            idempotency_key: '403/invalid_capability_issue',
            nonce: '403/invalid_capability_issue',
            signature_encoding: '403/invalid_capability_issue',
            signature_malleability: '403/invalid_capability_issue',
            signature_scalar: '403/invalid_capability_issue',
            signature_mismatch: '403/invalid_capability_issue',
          };
          const hubFrame = (tag, value) => {
            const prefix = Buffer.alloc(3);
            prefix[0] = tag;
            prefix.writeUInt16BE(value.length, 1);
            return Buffer.concat([prefix, value]);
          };
          const issueFrame = value => {
            const bytes = Buffer.from(value, 'utf8');
            const prefix = Buffer.alloc(4);
            prefix.writeUInt32BE(bytes.length);
            return Buffer.concat([prefix, bytes]);
          };
          const deriveDMIssueIdempotency = golden => {
            const body = JSON.parse(golden.body_utf8);
            const frame = value => {
              const bytes = Buffer.from(String(value), 'utf8');
              const prefix = Buffer.alloc(4);
              prefix.writeUInt32BE(bytes.length);
              return Buffer.concat([prefix, bytes]);
            };
            const preimage = Buffer.concat([
              Buffer.from(dm.contract.idempotency_derivation_domain_ascii, 'ascii'), Buffer.from([0]),
              frame(golden.issuer_id), frame(body.upload_handle), frame(body.issue_generation),
            ]);
            return {
              preimage,
              key: dm.contract.idempotency_key_prefix + crypto.createHash('sha256').update(preimage).digest('base64url'),
            };
          };
          const dmP256Order = BigInt('0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551');
          const parseDMSignature = encoded => {
            if (typeof encoded !== 'string' || !/^[A-Za-z0-9_-]+$/.test(encoded)) return null;
            const der = Buffer.from(encoded, 'base64url');
            if (der.toString('base64url') !== encoded || der.length > 72 || der.length < 8) return null;
            let offset = 0;
            if (der[offset++] !== 0x30) return null;
            const sequenceLength = der[offset++];
            if (sequenceLength >= 0x80 || sequenceLength !== der.length - offset) return null;
            const readInteger = () => {
              if (der[offset++] !== 0x02) return null;
              const length = der[offset++];
              if (length < 1 || length > 33 || offset + length > der.length) return null;
              const value = der.subarray(offset, offset + length);
              offset += length;
              if ((value[0] & 0x80) !== 0 ||
                  (value.length > 1 && value[0] === 0 && (value[1] & 0x80) === 0)) return null;
              return BigInt(`0x${value.toString('hex')}`);
            };
            const r = readInteger();
            const s = readInteger();
            if (r === null || s === null || offset !== der.length ||
                r <= 0n || r >= dmP256Order || s <= 0n || s > dmP256Order / 2n) return null;
            return der;
          };
          const verifyDMGolden = golden => {
            const bodyHash = crypto.createHash('sha256').update(golden.body_utf8, 'utf8').digest('hex');
            const canonical = Buffer.concat([
              Buffer.from(dm.contract.signing_domain_ascii, 'ascii'), Buffer.from([0]),
              ...dm.contract.field_order.map(name => issueFrame({
                method: golden.method,
                authority: golden.authority,
                route: golden.route,
                issuer_id: golden.issuer_id,
                kid: golden.kid,
                idempotency_key: golden.idempotency_key,
                timestamp_unix_decimal: String(golden.timestamp_unix),
                nonce: golden.nonce,
                body_sha256: bodyHash,
              }[name])),
            ]);
            const signature = parseDMSignature(golden.signature_der_b64url);
            if (signature === null) return false;
            return bodyHash === golden.body_sha256 &&
              canonical.toString('hex') === golden.canonical_hex &&
              crypto.createHash('sha256').update(canonical).digest('hex') === golden.signing_digest_hex &&
              crypto.verify(
                'sha256', canonical,
                crypto.createPublicKey({key: Buffer.from(golden.public_key_der_b64url, 'base64url'), format: 'der', type: 'spki'}),
                signature,
              );
          };
          const deriveHubRequestId = vector => {
            const peer = Buffer.from(vector.authenticated_peer_public_key_b64, 'base64');
            const nonce = Buffer.from(vector.request_nonce, 'base64url');
            const preimage = Buffer.concat([
              Buffer.from(`${h.contract.domain_ascii}\0`, 'ascii'),
              hubFrame(1, Buffer.from(vector.environment, 'ascii')),
              hubFrame(2, Buffer.from(vector.operation, 'ascii')),
              hubFrame(3, peer),
              hubFrame(4, nonce),
            ]);
            if (preimage.toString('hex') !== vector.preimage_hex) return false;
            return crypto.createHash('sha256').update(preimage).digest('hex') === vector.hub_request_id;
          };
          const deriveConnectorResourceRequestId = () => {
            const peer = Buffer.from(rr.fixtures.authenticated_peer_public_key_b64, 'base64');
            const nonce = Buffer.from(rr.fixtures.create_request_nonce, 'base64url');
            const preimage = Buffer.concat([
              Buffer.from(`${u.protocol.cell_request_id_domain}\0`, 'ascii'),
              hubFrame(1, Buffer.from(u.fixtures.environment, 'ascii')),
              hubFrame(2, peer),
              hubFrame(3, nonce),
            ]);
            return crypto.createHash('sha256').update(preimage).digest('hex');
          };
          const rawHubCookieIp = source => {
            const unmapped = source.startsWith('::ffff:') ? source.slice(7) : source;
            if (net.isIPv4(unmapped)) {
              return {family: 4, raw: Buffer.from(unmapped.split('.').map(Number))};
            }
            if (!net.isIPv6(unmapped)) return null;
            const halves = unmapped.split('::');
            if (halves.length > 2) return null;
            const left = halves[0] ? halves[0].split(':') : [];
            const right = halves.length === 2 && halves[1] ? halves[1].split(':') : [];
            const zeroes = 8 - left.length - right.length;
            if (zeroes < 0 || (halves.length === 1 && zeroes !== 0)) return null;
            const words = [...left, ...Array(zeroes).fill('0'), ...right];
            const raw = Buffer.alloc(16);
            words.forEach((word, index) => raw.writeUInt16BE(Number.parseInt(word, 16), index * 2));
            return {family: 6, raw};
          };
          const deriveHubLstCookie = vector => {
            const ip = rawHubCookieIp(vector.source_ip);
            if (!ip) return false;
            const peer = Buffer.from(vector.authenticated_peer_public_key_b64, 'base64');
            const rawLength = Buffer.alloc(4);
            rawLength.writeUInt32BE(ip.raw.length);
            const peerLength = Buffer.alloc(4);
            peerLength.writeUInt32BE(peer.length);
            const window = Buffer.alloc(8);
            window.writeBigUInt64BE(BigInt(vector.window_index));
            const preimage = Buffer.concat([
              Buffer.from(`${hc.contract.cookie_domain_ascii}\0`, 'ascii'),
              Buffer.from([ip.family]), rawLength, ip.raw,
              peerLength, peer, window,
            ]);
            if (preimage.toString('hex') !== vector.preimage_hex) return false;
            const cookie = crypto.createHmac('sha256', Buffer.from(vector.signing_key_hex, 'hex'))
              .update(preimage).digest();
            return cookie.toString('hex') === vector.cookie_hex && cookie.toString('base64') === vector.cookie_b64;
          };
          const cridCrc32c = buf => {
            let crc = 0xffffffff;
            for (const byte of buf) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (0x82f63b78 & -(crc & 1));
            }
            return (crc ^ 0xffffffff) >>> 0;
          };
          const cridBase32 = buf => {
            let bits = 0, value = 0, out = '';
            for (const byte of buf) {
              value = (value << 8) | byte;
              bits += 8;
              while (bits >= 5) { out += cd.contract.alphabet[(value >>> (bits - 5)) & 31]; bits -= 5; }
            }
            return bits ? out + cd.contract.alphabet[(value << (5 - bits)) & 31] : out;
          };
          const deriveCrid = vector => {
            const der = Buffer.from(vector.der_spki_b64url, 'base64url');
            const digest = crypto.createHash('sha256')
              .update(Buffer.concat([Buffer.from(cd.contract.domain_separation_prefix, 'ascii'), Buffer.from([0]), der]))
              .digest();
            if (digest.toString('hex') !== vector.digest_hex) return false;
            const payload = Buffer.concat([Buffer.from(vector.version_byte, 'hex'), digest]);
            const crc = Buffer.alloc(4);
            crc.writeUInt32BE(cridCrc32c(payload));
            if (crc.toString('hex') !== vector.crc_hex) return false;
            const encoded = Buffer.concat([payload, crc]);
            if (encoded.toString('hex') !== vector.payload_hex) return false;
            return cridBase32(encoded) === vector.expected_crid;
          };
          const cridValues = Object.fromEntries(cd.consumer_value_cases.map(v => [v.name, v]));
          const hubRequestIds = new Set(h.cases.map(v => v.hub_request_id));
          const recoveryRequestIdCase = h.cases.find(v => v.operation === 'IssueCredentialRecovery');
          const recoveryCookieKat = hc.cookie_kats.find(v => v.name === 'ipv4');
          const authorityRequests = Object.fromEntries(
            Object.entries(u.operations).map(([name, operation]) => [name, JSON.parse(operation.request_golden.body_json)])
          );
          const globalAuthorityOperations = ['IssueAssignment', 'RefreshAssignment', 'MutateProofAgent'];
          const cellAuthorityOperations = ['IssueRegistrationOTP', 'ActivateRegistration', 'CompleteRegistration', 'ResolveConnectorResource'];
          // Keep proof-mutation assertions in lockstep with the Python package
          // smoke below; the deliberate re-encoding catches consumer drift.
          const proofMutationRejectNames = new Set(['reject_unknown_field', 'reject_wrong_type', 'reject_missing_field']);
          const proofMutationRejects = Object.fromEntries(
            u.operations.MutateProofAgent.request_rejects
              .filter(v => proofMutationRejectNames.has(v.name))
              .map(v => [v.name, JSON.parse(v.body_json)])
          );
          const proofMutationReplay = u.operations.MutateProofAgent.replay_contract;
          const resourceReplay = u.operations.ResolveConnectorResource.resource_replay_contract;
          const resourceSuccess = JSON.parse(rr.success_exchanges[0].result.body_json).list;
          const resourceAuthoritySuccess = JSON.parse(u.operations.ResolveConnectorResource.success_golden.body_json).result;
          const activationUnavailable = u.operations.ActivateRegistration.public_mapping_cases.find(v => v.name === 'unavailable');
          const replies = Object.fromEntries(k.reply_cases.map(v => [v.name, v]));
          const requests = Object.fromEntries(k.request_cases.map(v => [v.name, v]));
          const idResponses = Object.fromEntries(i.consumer_response_cases.map(v => [v.name, v]));
          const hubCookieChallenges = Object.fromEntries(hc.challenge_cases.map(v => [v.name, v]));
          const hubCookieChallengeFlags = {
            accept_initial_challenge: '0000',
            accept_refresh_challenge: '0000',
            reject_malformed_body: '0000',
            reject_unknown_field: '0000',
            reject_duplicate_field: '0000',
            reject_wrong_transaction: '0000',
            reject_cookie_encoding: '0000',
            reject_cookie_length: '0000',
            reject_untrusted_server: '0000',
            reject_compressed_challenge: '0002',
            reject_unknown_flag_challenge: '0008',
            reject_second_challenge: '0000',
          };
          const hubCookieChallengesComplete =
            hc.challenge_cases.length === Object.keys(hubCookieChallengeFlags).length &&
            Object.entries(hubCookieChallengeFlags).every(([name, flags]) =>
              hubCookieChallenges[name]?.header_flags_hex === flags
            );
          const idValuePattern = new RegExp(i.contract.pattern);
          const idValuesAgree = i.consumer_value_cases.every(
            v => idValuePattern.test(v.value) === (v.outcome === 'accept')
          );
          const canonical = '0123456789abcdef';
          const resource = 'connector-conformance-01';
          // Stock JSON parsing is intentionally insufficient for these cases:
          // duplicate keys collapse last-wins and aliases remain unchecked.
          const lossyDuplicate = JSON.parse(requests.reject_duplicate_run_id.body_json);
          const uncheckedAlias = JSON.parse(requests.reject_alias_run_id.body_json);
          const assignmentInitial = JSON.parse(s.initial_assignment.result.body_json).list;
          const assignmentRefresh = JSON.parse(s.refresh_assignment.result.body_json).list;
          const assignmentInitialRequest = JSON.parse(s.initial_assignment.request.body_json);
          const assignmentRefreshRequest = JSON.parse(s.refresh_assignment.request.body_json);
          const nonceIsCanonical32 = value => {
            const decoded = Buffer.from(value, 'base64url');
            return decoded.length === 32 && decoded.toString('base64url') === value;
          };
          // sessId is uint64 authority and the fixture deliberately exceeds
          // Number.MAX_SAFE_INTEGER. Extract its canonical decimal token from
          // the already-strict body and compare as BigInt; JSON.parse would
          // silently make nearby session IDs equal after rounding.
          const exactSessionID = body => {
            const match = /"sessId":(0|[1-9][0-9]*)(?=[,}])/.exec(body);
            if (!match) throw new Error('missing or noncanonical sessId');
            return BigInt(match[1]);
          };
          const assignmentRegister = JSON.parse(s.assigned_cell_registration.request.body_json);
          const assignmentOtp = JSON.parse(s.account_credential_otp.request.body_json);
          const assignmentOtpBinding = s.account_credential_otp.enrollment_binding;
          const assignmentOtpRequests = Object.fromEntries(s.account_credential_otp.request_cases.map(v => [v.name, v]));
          const assignmentOtpBindings = Object.fromEntries(s.account_credential_otp.binding_cases.map(v => [v.name, v]));
          const assignmentOtpChallengeBindings = Object.fromEntries(s.account_credential_otp.challenge_binding_cases.map(v => [v.name, v]));
          const assignmentOtpChallengesAgree = [
            'reject_challenge_ticket_jti_mismatch',
            'reject_challenge_peer_public_key_mismatch',
            'reject_challenge_dev_id_mismatch',
            'reject_challenge_credential_key_id_mismatch',
            'reject_challenge_environment_mismatch',
            'reject_challenge_cell_mismatch',
          ].every(name => assignmentOtpChallengeBindings[name].reject_class === 'challenge_binding');
          const assignmentOtpSizes = Object.fromEntries(s.account_credential_otp.packet_size_contract.cases.map(v => [v.name, v]));
          const assignmentCompletionRequest = JSON.parse(s.registration_completion.request.body_json);
          const deviceApiKey = assignmentCompletionRequest.usrData.device_api_key;
          const deviceApiKeyPrefix = 'lv_live_';
          const deviceApiKeySecretBytes = 32;
          const deviceApiKeyBody = deviceApiKey.slice(deviceApiKeyPrefix.length);
          const deviceApiKeyBytes = Buffer.from(deviceApiKeyBody, 'base64url');
          const deviceApiKeyCanonical = deviceApiKey.startsWith(deviceApiKeyPrefix) &&
            deviceApiKeyBytes.length === deviceApiKeySecretBytes &&
            deviceApiKeyBytes.every((value, index) => value === index) &&
            deviceApiKeyBytes.toString('base64url') === deviceApiKeyBody;
          const assignmentCompletion = JSON.parse(s.registration_completion.result.body_json).list;
          const assignmentRequests = Object.fromEntries(s.request_cases.map(v => [v.name, v]));
          const nullNonce = JSON.parse(assignmentRequests.reject_null_initial_request_nonce.body_json).usrData.request_nonce;
          const standardBase64Nonce = JSON.parse(assignmentRequests.reject_standard_base64_refresh_request_nonce.body_json).usrData.request_nonce;
          const nonCanonicalTailNonce = JSON.parse(assignmentRequests.reject_noncanonical_tail_bits_refresh_request_nonce.body_json).usrData.request_nonce;
          const refreshNonceBytes = Buffer.from(assignmentRefreshRequest.usrData.request_nonce, 'base64url');
          const assignmentResults = Object.fromEntries(s.success_result_cases.map(v => [v.name, v]));
          const assignmentErrors = Object.fromEntries(s.error_contract.assignment_cases.map(v => [v.name, v]));
          const assignmentMalformed = Object.fromEntries(s.error_contract.malformed_cases.map(v => [v.name, v]));
          const sessionCookie = Buffer.from(x.overload_reknock.cookie_b64, 'base64');
          const sessionPackets = [
            x.overload_reknock.knock_request,
            x.overload_reknock.cookie_reply,
            x.overload_reknock.reknock_request,
            x.overload_reknock.ack,
            x.exact_session_exit.request,
            x.exact_session_exit.ack,
            x.denial_acks.knock,
            x.denial_acks.exit,
          ];
          const sessionKnock = JSON.parse(x.overload_reknock.knock_request.body_json);
          const sessionACK = JSON.parse(x.overload_reknock.ack.body_json);
          const exactExitRequest = JSON.parse(x.exact_session_exit.request.body_json);
          const exactExitAck = JSON.parse(x.exact_session_exit.ack.body_json);
          const knockDenial = JSON.parse(x.denial_acks.knock.body_json);
          const exitDenial = JSON.parse(x.denial_acks.exit.body_json);
          const deniedAuthorityFields = ['cellId', 'sessId', 'sessIssuedAtMillis', 'runId', 'runAttempt', 'closeEventId', 'state'];
          if (qv2.schema_version !== 2 || qv2.transport_contract.prefix !== 'qv2t1' ||
              qv2.transport_contract.component_max !== 240 ||
              qv2.transport_contract.max_transport_length !== 6826 ||
              qv2.classes.transport.vectors.length !== 39 || !c.issuerSignatureVectors().issuer ||
              !r.knock.packet_hex || !r.ack.packet_hex || !a.otp.packet_hex || !a.rak_success.packet_hex ||
              s.schema_version !== 4 || s.initial_assignment.request.header_type !== 5 ||
              !nonceIsCanonical32(assignmentInitialRequest.usrData.request_nonce) ||
              !nonceIsCanonical32(assignmentRefreshRequest.usrData.request_nonce) ||
              assignmentInitialRequest.usrData.request_nonce === assignmentRefreshRequest.usrData.request_nonce ||
              JSON.stringify(s.public_registration_key_kinds) !== JSON.stringify(['bootstrap', 'connector_bootstrap', 'account', 'agent']) ||
              s.initial_assignment.result.header_type !== 6 ||
              s.initial_assignment.request.counter !== s.initial_assignment.result.counter ||
              s.assigned_cell_registration.request.header_type !== 13 ||
              s.assigned_cell_registration.result.header_type !== 14 ||
              s.assigned_cell_registration.request.counter !== s.assigned_cell_registration.result.counter ||
              s.account_credential_otp.producer_revision !== '2072546e1fc76eb76bd7e5c22d37856019ba33e7' ||
              s.account_credential_otp.raw_body_required !== true ||
              s.account_credential_otp.authenticated_peer_public_key_required !== true ||
              JSON.stringify(s.account_credential_otp.otp_registration_key_kinds) !== JSON.stringify(['account']) ||
              JSON.stringify(s.account_credential_otp.otp_free_registration_key_kinds) !== JSON.stringify(['bootstrap', 'connector_bootstrap', 'agent']) ||
              s.account_credential_otp.request.header_type !== 12 ||
              s.account_credential_otp.request.receiver_key !== 'assigned_cell' ||
              assignmentOtp.usrId !== assignmentOtpBinding.request_registration_key_id ||
              assignmentOtp.devId !== assignmentOtpBinding.request_agent_id ||
              assignmentOtp.pass !== assignmentOtpBinding.request_credential ||
              assignmentOtp.usrData.query !== 'agent_registration_otp' ||
              assignmentOtp.usrData.version !== 1 ||
              assignmentOtp.usrData.assignment_ticket !== assignmentOtpBinding.request_assignment_ticket ||
              assignmentOtpBinding.request_credential_hash_b64 !== assignmentOtpBinding.ticket_credential_key_hash_b64 ||
              assignmentOtpBinding.recomputed_credential_fence_b64 !== assignmentOtpBinding.ticket_credential_fence_b64 ||
              s.account_credential_otp.challenge_binding.lookup_key_field !== 'ticket_jti' ||
              JSON.stringify(s.account_credential_otp.challenge_binding.required_match_fields) !== JSON.stringify(['ticket_jti', 'authenticated_peer_public_key_b64', 'dev_id', 'credential_key_id', 'environment_id', 'cell_id']) ||
              s.account_credential_otp.challenge_binding.ticket_jti !== assignmentOtpBinding.ticket_jti ||
              s.account_credential_otp.challenge_binding.authenticated_peer_public_key_b64 !== assignmentOtpBinding.authenticated_peer_public_key_b64 ||
              s.account_credential_otp.challenge_binding.dev_id !== assignmentOtpBinding.request_agent_id ||
              s.account_credential_otp.challenge_binding.credential_key_id !== assignmentOtpBinding.request_registration_key_id ||
              s.account_credential_otp.challenge_binding.environment_id !== assignmentOtpBinding.local_environment_id ||
              s.account_credential_otp.challenge_binding.cell_id !== assignmentOtpBinding.local_cell_id ||
              assignmentOtp.pubKey !== undefined ||
              assignmentOtpBinding.ticket_expires_at_unix - assignmentOtpBinding.evaluated_at_unix !== 630 ||
              assignmentOtpBinding.minimum_ticket_remaining_seconds !== 630 ||
              s.account_credential_otp.request_cases.length !== 17 ||
              assignmentOtpRequests.reject_duplicate_otp_assignment_ticket.reject_class !== 'body_parse' ||
