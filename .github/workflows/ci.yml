          assert dm['contract']['success_data_fields'] == ['capability', 'capability_expires_at', 'authority_expires_at']
          assert dm['contract']['error_content_type'] == 'application/problem+json'
          assert dm['contract']['body_authority_fields'] == [
              'upload_handle', 'issue_generation', 'upload_request_digest', 'content_sha256', 'byte_size',
              'media_type', 'display_filename', 'audience_key_id', 'target_path', 'max_batch_size',
              'max_link_ttl_seconds', 'capability_expires_at', 'authority_expires_at',
          ]
          assert dm['contract']['capability_ttl_seconds'] == 900 and dm['contract']['authority_max_ttl_seconds'] == 86400
          assert dm['contract']['nonce_replay_retention_seconds'] == 900
          assert dm['contract']['nonce_replay_retention_seconds'] > 2 * dm['contract']['timestamp_max_skew_seconds']
          assert dm['contract']['retry_after_modes'] == ['absent', 'exact_seconds', 'positive_integer_seconds']
          assert dm['contract']['external_operation_commit_rule'] == 'uncommitted_external_operation_may_advance_internal_issue_generation_within_same_authority_committed_external_response_replays_byte_exact_new_outward_capability_requires_new_signed_external_request'
          assert dm['contract']['envelope_fingerprint_fields'] == [
              'method', 'authority', 'route', 'issuer_id', 'kid', 'idempotency_key',
              'timestamp_unix_decimal', 'nonce', 'body_sha256', 'signature_der_b64url',
          ]
          assert dm['contract']['stale_operation_miss_status'] == 404
          assert dm['contract']['stale_operation_miss_code'] == 'issue_operation_not_found'
          assert dm['golden']['kid'] != dm['retry_golden']['kid']
          assert dm['golden']['public_key_der_b64url'] != dm['retry_golden']['public_key_der_b64url']
          assert dm['golden']['idempotency_key'] == dm['retry_golden']['idempotency_key']
          assert dm['golden']['body_sha256'] != dm['retry_golden']['body_sha256']
          assert dm['golden']['kid'] != dm['refresh_golden']['kid']
          assert dm['golden']['public_key_der_b64url'] != dm['refresh_golden']['public_key_der_b64url']
          assert len(dm['reject_cases']) == 9 and len(dm_rejects) == 9
          assert {case['reject_class'] for case in dm['reject_cases']} == set(dm['contract']['reject_classes'])
          assert all(case['outcome'] == 'reject' for case in dm['reject_cases'])
          assert all((case['status'], case['error_code']) == dm_reject_responses[case['reject_class']] for case in dm['reject_cases'])
          assert all(
              derive_dm_issue_idempotency(golden)[0].hex() == golden['idempotency_preimage_hex'] and
              derive_dm_issue_idempotency(golden)[1] == golden['idempotency_key']
              for golden in dm_signed_inputs
          )
          assert len(dm['state_cases']) == 9
          assert [case['name'] for case in dm['state_cases']] == [
              'first_issue', 'exact_stale_replay', 'fresh_reconciliation', 'generation_2_refresh', 'stale_unseen',
              'alternate_endpoint', 'reused_nonce_across_operation', 'stale_non_exact_retry',
              'fresh_authority_conflict',
          ]
          assert len(dm['response_cases']) == 8
          assert [case['error_code'] for case in dm['response_cases'] if case['proves_operation_absent']] == ['issue_operation_not_found']
          assert next(case for case in dm['response_cases'] if case['error_code'] == 'rate_limit_exceeded')['retry_after'] == {'mode': 'positive_integer_seconds'}
          assert next(case for case in dm['response_cases'] if case['error_code'] == 'mutation_outcome_unknown')['retry_after'] == {'mode': 'exact_seconds', 'seconds': 1}
          assert all(case['retry_after'] == {'mode': 'absent'} for case in dm['response_cases'] if case['error_code'] not in {'rate_limit_exceeded', 'mutation_outcome_unknown'})
          assert dm['wrong_endpoint_signed']['authority'] != dm['golden']['authority']
          assert dm['wrong_endpoint_signed']['public_key_der_b64url'] == dm['golden']['public_key_der_b64url']
          assert dm['nonce_reuse_signed']['nonce'] == dm['golden']['nonce']
          assert dm['nonce_reuse_signed']['idempotency_key'] == dm['refresh_golden']['idempotency_key']
          assert dm['nonce_reuse_signed']['timestamp_unix'] - (dm['golden']['timestamp_unix'] - dm['contract']['timestamp_max_skew_seconds']) < dm['contract']['nonce_replay_retention_seconds']
          nonce_reuse_state = next(case for case in dm['state_cases'] if case['name'] == 'reused_nonce_across_operation')
          assert abs(nonce_reuse_state['now_unix'] - dm['nonce_reuse_signed']['timestamp_unix']) <= dm['contract']['timestamp_max_skew_seconds']
          assert all(verify_dm_framing_and_digest(golden) for golden in (
              dm['golden'], dm['retry_golden'], dm['refresh_golden'],
              dm['wrong_endpoint_signed'], dm['nonce_reuse_signed'],
              dm['authority_conflict_signed'],
          ))
          print('py ok')
          PY

  # Slack build-completion card. Thin shim over the fleet-shared reusable in
  # layervai/ops-routines-workflows (public mirror of private
  # layervai/ops-routines); the Block Kit payload builder and gate-result
  # aggregation live there. Adding/removing a gate is a one-line edit to
  # `needs:` + `gates:` here.
  notify:
    name: Notify
    needs: [conformance]
    # `!cancelled()` rather than `always()`: this repo sets
    # concurrency.cancel-in-progress, so a newer push to main cancels the
    # in-flight run. `always()` would still post a yellow "cancelled" card for
    # every superseded push. We notify on success and failure; we stay quiet
    # only when the run is cancelled out from under us. Skipped on PRs.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions: {}
    uses: layervai/ops-routines-workflows/.github/workflows/notify.yml@d07fa2fe3a103907ff2b1a1a71509a6dcd8e9d32 # v0.13.0
    with:
      header: "qURL Conformance Build"
      gates: '{"Conformance": "${{ needs.conformance.result }}"}'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
