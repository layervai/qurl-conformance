name: Release Please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      npm_release_created: ${{ steps.release.outputs['npm--release_created'] }}
      npm_tag_name: ${{ steps.release.outputs['npm--tag_name'] }}
      python_release_created: ${{ steps.release.outputs['python--release_created'] }}
      python_tag_name: ${{ steps.release.outputs['python--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.npm_release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the tag release-please just pushed so a post-merge
          # commit on `main` can't sneak into the published tarball.
          ref: ${{ needs.release-please.outputs.npm_tag_name }}
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          # Required for OIDC trusted publishing — npm runs the OIDC exchange
          # against this registry.
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Pin npm for trusted publishing
        run: npm install -g npm@11.10.0
      # Trusted publishing (OIDC): no NODE_AUTH_TOKEN. With the job's
      # `id-token: write`, npm authenticates via the trusted publisher
      # configured for @layervai/qurl-conformance on npmjs.com (provider
      # GitHub Actions, repo layervai/qurl-conformance, workflow
      # release-please.yml, environment npm-publish).
      - name: Publish to npm
        run: npm publish --provenance
        working-directory: npm

  publish-pypi:
    needs: release-please
    if: needs.release-please.outputs.python_release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.python_tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build
        run: python -m build
        working-directory: python
      # Trusted publishing (OIDC) + PEP 740 attestations. With the job's
      # `id-token: write`, pypi authenticates via the pending/trusted
      # publisher configured for qurl-conformance on PyPI (workflow
      # release-please.yml, environment pypi).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Must override — default is repo-root dist/, but we build in python/.
          packages-dir: python/dist/
          # Set PEP 740 attestation behavior explicitly rather than relying
          # on the default.
          attestations: true

  # Turn the silent failure into a red run.
  #
  # v0.12.3 merged its release PR, wrote CHANGELOG.md and the manifest to main,
  # created NO tag, and exited 0 — release-please could not match the root
  # package and simply built zero releases. Nothing failed, so nothing was
  # noticed until someone went looking for the tag. The config fix that caused
  # it is in release-please-config.json (see RELEASE_CHECKLIST.md), but a config
  # fix alone leaves the same failure mode reachable the next time this
  # matching logic shifts under us.
  #
  # This asserts the outcome rather than the mechanism: if the commit we just
  # pushed is release-please's own release commit, then the version the manifest
  # now claims for the root module MUST have a matching tag. Deliberately not
  # keyed on the action's `outputs` — the whole bug was release-please believing
  # it had nothing to release, so its own outputs are not a trustworthy witness.
  verify-root-tag:
    name: Verify the root release produced a tag
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert a release commit cut its root tag
        run: |
          set -euo pipefail

          # Two independent signals, because a silent skip here would quietly
          # reopen the exact blind spot this job exists to close. The subject is
          # the documented default, but it is editable — a customized
          # release-commit-message, or a squash-merge with a hand-edited title,
          # would slip past it. A touched manifest is the harder signal: nothing
          # but a release moves the versions release-please owns.
          subject="$(git log -1 --pretty=%s)"
          changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"

          is_release=false
          case "$subject" in "chore: release"*) is_release=true ;; esac
          case "$changed" in *".release-please-manifest.json"*) is_release=true ;; esac

          if [ "$is_release" != "true" ]; then
            echo "HEAD is not a release commit; nothing to verify."
            echo "  subject: ${subject}"
            exit 0
          fi

          version="$(jq -r '.["."]' .release-please-manifest.json)"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::.release-please-manifest.json has no root (\".\") version"
            exit 1
          fi

          # include-component-in-tag is false for the root package, so the Go
          # module tag is a bare vX.Y.Z. That shape is load-bearing: `go-vX.Y.Z`
          # is invisible to the Go module proxy.
          tag="v${version}"
          git fetch --tags --quiet

          # Existence is not enough: a stale tag of the right NAME left by a
          # partial recovery or an earlier re-run would pass while pointing at
          # the wrong commit. Assert it resolves to the commit we just pushed.
          if tagged="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
            if [ "${tagged}" = "${GITHUB_SHA}" ]; then
              echo "OK: ${tag} exists and points at ${GITHUB_SHA}."
              exit 0
            fi
            echo "::error::${tag} exists but points at ${tagged}, not this release commit (${GITHUB_SHA})."
            echo "::error::A stale or mis-targeted tag is as broken as a missing one — consumers would resolve the wrong tree."
            exit 1
          fi

          echo "::error::Release commit merged for ${tag} but no ${tag} tag exists."
          echo "::error::release-please built zero releases for the root package — the exact v0.12.3 failure."
          echo "::error::Check the release-please job log for: 'PR component: ... does not match configured component'."
          echo "::error::Recovery: create the tag and GitHub Release at this commit, then relabel the merged release PR 'autorelease: tagged' so later release PRs stop aborting. See RELEASE_CHECKLIST.md."
          exit 1
