version: 2
updates:
  # Go modules — three independent module roots in this repo.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /tools/gen
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # JavaScript / npm package.
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Python package.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Dependabot tracks each codeql-action sub-action as its own
      # dependency, so an ungrouped bump moves `analyze` and leaves
      # `init` behind. Those two must run the same version: `init`
      # writes a config file stamped with its own version and `analyze`
      # refuses to load it, failing every matrix leg with "Loaded a
      # configuration file for version X, but running version Y".
      # Grouping them keeps the bump atomic so the PR is green on its
      # own instead of needing a hand-patched matching pin (see #66, #73).
      codeql-action:
        patterns:
          - "github/codeql-action*"
